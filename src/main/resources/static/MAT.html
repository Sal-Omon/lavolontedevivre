<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Corretto -->
    <link rel="stylesheet" href="MAT_Css.css">
    <title>MAT</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<a id="logoutBtn" href="Login.html">Logout</a>

<div id="divIrlValues">
    <div id="divSection">
        <div id="divAir">
            <h3>
                &#9729; Aria
            </h3>
            <p>Umidità: <span id="spanHumAir"></span> %</p>
            <p>Temperatura: <span id="spanTempAir"></span>°C</p>
        </div>

        <div id="divGround">
            <h3>
                &#9178; Terreno
            </h3>
            <p>Umidità: <span id="spanHumGround"></span>%</p>
            <p>Temperatura: <span id="spanTempGround"></span>°C</p>
        </div>

        <div id="divLight">
            <h3>
                &#9788; Ore di luce
            </h3>
            <p>Intensità: <span id="spanLight"></span></p>
        </div>

        <div id="divWind">
            <h3>
                &#x1F32C; Vento
            </h3>
            <p>Velocità: <span id="spanWind"></span>Km/h</p>
        </div>
    </div>
</div>

<div id="divChartContainer">
    <div id="column1">
        <canvas id="canvasAir"></canvas>
        <canvas id="canvasGround"></canvas>
    </div>
    <div id="column2">
        <canvas id="canvasLight"></canvas>
        <canvas id="canvasWind"></canvas>
    </div>
</div>

<script src="mat.js"></script> <!-- Carica il file JS per i grafici -->
</body>
</html>
