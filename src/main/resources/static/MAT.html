<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="MAT_Css.css">
    <title>MAT</title>
    <script src="mat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { display: none; } /* Nasconde il corpo fino alla verifica del token */
    </style>
</head>
<body>
<div class="sun-icon"></div>
<a href="Login.html" id="logoutBtn">Logout</a>

<div id="divIrlValues">
    <div id="divSection">
        <div id="divAir">
            <h3>&#9729; Aria</h3>
            <p>Umidità: <span></span>%</p>
            <p>Temperatura: <span></span>°C</p>
        </div>

        <div id="divGround">
            <h3>&#9178; Terreno</h3>
            <p>Umidità: <span></span>%</p>
            <p>Temperatura: <span></span>°C</p>
        </div>

        <div id="divLight">
            <h3>&#9788; Ore di luce</h3>
            <p>Tempo: <span></span></p>
        </div>

        <div id="divWind">
            <h3>&#x1F32C; Vento</h3>
            <p>Velocità: <span></span> Km/h</p>
        </div>
    </div>
</div>

<div id="corniceGrafico">
    <div class="divClasses">
        <canvas id="mioGrafico"></canvas>
    </div>
    <div class="divClasses">
        <svg width="300" height="200">
            <rect x="20" y="20" width="50" height="150" fill="#3498db" />
            <rect x="90" y="50" width="50" height="120" fill="#e74c3c" />
            <rect x="160" y="80" width="50" height="90" fill="#2ecc71" />
        </svg>
    </div>
    <div class="divClasses">
        <svg width="300" height="200">
            <rect x="20" y="20" width="50" height="150" fill="#3498db" />
            <rect x="90" y="50" width="50" height="120" fill="#e74c3c" />
            <rect x="160" y="80" width="50" height="90" fill="#2ecc71" />
        </svg>
    </div>
    <div class="divClasses">
        <svg width="300" height="200">
            <rect x="20" y="20" width="50" height="150" fill="#3498db" />
            <rect x="90" y="50" width="50" height="120" fill="#e74c3c" />
            <rect x="160" y="80" width="50" height="90" fill="#2ecc71" />
        </svg>
    </div>
</div>
</body>
</html>
